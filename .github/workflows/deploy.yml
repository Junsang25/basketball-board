name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions 탭에서 직접 돌릴 수도 있게 해둔다
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 밀린 건 최신 것만 남긴다
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # build 안에서 tsc -b 가 먼저 돌아서, 타입이 깨지면 배포도 멈춘다
      - run: npm run build

      # 저장소 Settings > Pages 의 Source 가 "GitHub Actions" 여야 한다
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
